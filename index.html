<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>jikoキャラ診断 | あなたの就活キャラクターを発見しよう</title>
  <meta name="description" content="MBTIとAI対話で、あなただけのRPGキャラクターを診断。就活の自己分析を、冒険に変えよう。">
  <meta property="og:title" content="jikoキャラ診断">
  <meta property="og:description" content="MBTIとAI対話で、あなただけのRPGキャラクターを診断。">
  <meta property="og:image" content="/static/ogp_default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060b1a;
      --bg-mid: #0d1530;
      --bg-card: #111a38;
      --gold: #d4af37;
      --gold-light: #f0d060;
      --gold-dim: #8a7020;
      --amber: #c27c1a;
      --text-primary: #f0e8cc;
      --text-secondary: #b8a880;
      --text-dim: #6a5f45;
      --border: rgba(212,175,55,0.25);
      --border-bright: rgba(212,175,55,0.6);
      --glow: 0 0 20px rgba(212,175,55,0.3);
      --glow-strong: 0 0 40px rgba(212,175,55,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .emblem {
      width: 80px;
      height: 80px;
      margin-bottom: 32px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .emblem svg { width: 100%; height: 100%; }

    .subtitle-top {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 16px;
      animation: fadeInDown 1s ease both;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 900;
      color: var(--gold);
      text-shadow: var(--glow-strong);
      letter-spacing: 2px;
      animation: fadeInDown 1s ease 0.2s both;
      line-height: 1.1;
    }

    .logo-jp {
      font-size: clamp(14px, 3vw, 20px);
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 6px;
      margin-top: 8px;
      animation: fadeInDown 1s ease 0.4s both;
      font-family: 'Noto Serif JP', serif;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto;
      animation: fadeIn 1s ease 0.6s both;
    }

    .hero-desc {
      font-size: clamp(14px, 2.5vw, 17px);
      color: var(--text-secondary);
      line-height: 2;
      max-width: 520px;
      margin-bottom: 48px;
      animation: fadeIn 1s ease 0.8s both;
    }

    .start-section {
      width: 100%;
      max-width: 480px;
      animation: fadeInUp 1s ease 1s both;
    }

    .input-wrap {
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
      font-family: 'Cinzel', serif;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'Noto Serif JP', serif;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input[type="text"]:focus {
      border-color: var(--gold);
      box-shadow: var(--glow);
    }
    input[type="text"]::placeholder { color: var(--text-dim); }

    .mbti-section {
      margin-bottom: 20px;
    }
    .mbti-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
      font-family: 'Cinzel', serif;
    }
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .mbti-btn {
      padding: 10px 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .mbti-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: var(--glow);
    }
    .mbti-btn.selected {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg-deep);
      font-weight: 700;
      box-shadow: var(--glow-strong);
    }

    .selected-mbti-display {
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
      min-height: 20px;
    }
    .selected-mbti-display span {
      color: var(--gold);
      font-family: 'Cinzel', serif;
    }

    .start-btn {
      width: 100%;
      padding: 18px;
      background: transparent;
      border: 2px solid var(--gold);
      border-radius: 4px;
      color: var(--gold);
      font-size: 16px;
      font-family: 'Cinzel', serif;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .start-btn:hover:not(:disabled) {
      background: var(--gold);
      color: var(--bg-deep);
      box-shadow: var(--glow-strong);
      transform: translateY(-1px);
    }
    .start-btn:disabled {
      border-color: var(--text-dim);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    .past-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 2px;
      transition: color 0.2s;
    }
    .past-link:hover { color: var(--gold); }

    .features {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 24px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .feature-card:hover {
      border-color: var(--gold);
      box-shadow: var(--glow);
    }
    .feature-icon { font-size: 32px; margin-bottom: 12px; }
    .feature-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .feature-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .error-msg {
      font-size: 13px;
      color: #e07070;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<section class="hero">

  </div>
