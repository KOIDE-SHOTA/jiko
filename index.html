<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>jikoキャラ診断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060b1a;
      --bg-mid: #0d1530;
      --bg-card: #111a38;
      --gold: #d4af37;
      --gold-light: #f0d060;
      --gold-dim: #8a7020;
      --text-primary: #f0e8cc;
      --text-secondary: #b8a880;
      --text-dim: #6a5f45;
      --border: rgba(212,175,55,0.25);
      --glow: 0 0 20px rgba(212,175,55,0.3);
      --glow-strong: 0 0 40px rgba(212,175,55,0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
    }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);
    }
    @keyframes twinkle {
      0%,100%{opacity:0.2;} 50%{opacity:1;}
    }

    /* ── ページ共通 ── */
    .page {
      display: none;
      position: relative;
      z-index: 1;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .page.active { display: flex; }

    /* ── ロゴ共通 ── */
    .logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      color: var(--gold);
      text-shadow: var(--glow-strong);
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .logo-jp {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 4px;
      margin-bottom: 32px;
    }
    .divider {
      width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 32px;
    }

    /* ── Page1: ニックネーム ── */
    .input-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'Noto Serif JP', serif;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input[type="text"]:focus {
      border-color: var(--gold);
      box-shadow: var(--glow);
    }
    input[type="text"]::placeholder { color: var(--text-dim); }

    .next-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      background: transparent;
      border: 2px solid var(--gold);
      border-radius: 4px;
      color: var(--gold);
      font-size: 16px;
      font-family: 'Cinzel', serif;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .next-btn:hover:not(:disabled) {
      background: var(--gold);
      color: var(--bg-deep);
      box-shadow: var(--glow-strong);
    }
    .next-btn:disabled {
      border-color: var(--text-dim);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* ── Page2: MBTI ── */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    .mbti-btn {
      padding: 12px 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .mbti-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .mbti-btn.selected {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg-deep);
      font-weight: 700;
      box-shadow: var(--glow-strong);
    }

    .past-link {
      display: block;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 2px;
      transition: color 0.2s;
    }
    .past-link:hover { color: var(--gold); }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Page1: ニックネーム -->
<div class="page active" id="page1">
  <h1 class="logo">jiko<br>キャラ診断</h1>
  <p class="logo-jp">— あなたの冒険を始めよう —</p>
  <div class="divider"></div>
  <label class="input-label" for="nickname">⚔ ニックネーム</label>
  <input type="text" id="nickname" placeholder="冒険者の名前を入力..." maxlength="20">
  <button class="next-btn" id="nextBtn" disabled onclick="goToPage2()">
    ✦ 冒険を始める ✦
  </button>
  <a href="#" class="past-link" id="pastLink" style="display:none">
    ▷ 前回の診断結果を見る
  </a>
</div>

<!-- Page2: MBTI -->
<div class="page" id="page2">
  <h1 class="logo">jiko<br>キャラ診断</h1>
  <p class="logo-jp">— あなたのMBTIを選んでください —</p>
  <div class="divider"></div>
  <div class="mbti-grid" id="mbtiGrid"></div>
</div>

<script>
  // 星
  const starsEl = document.getElementById("stars");
  for (let i = 0; i < 100; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--delay:${Math.random()*4}s;`;
    starsEl.appendChild(s);
  }

  // ニックネーム
  const nicknameInput = document.getElementById("nickname");
  nicknameInput.addEventListener("input", () => {
    document.getElementById("nextBtn").disabled = nicknameInput.value.trim().length === 0;
  });

  function goToPage2() {
    const nickname = nicknameInput.value.trim();
    if (!nickname) return;
    localStorage.setItem("jiko_nickname", nickname);
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
  }

  // MBTI
  const MBTI_TYPES = [
    "INTJ","INTP","ENTJ","ENTP",
    "INFJ","INFP","ENFJ","ENFP",
    "ISTJ","ISFJ","ESTJ","ESFJ",
    "ISTP","ISFP","ESTP","ESFP"
  ];
  const grid = document.getElementById("mbtiGrid");
  MBTI_TYPES.forEach(type => {
    const btn = document.createElement("button");
    btn.className = "mbti-btn";
    btn.textContent = type;
    btn.onclick = () => {
      localStorage.setItem("jiko_mbti", type);
      fetch("/api/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({nickname: localStorage.getItem("jiko_nickname"), mbti: type})
      }).then(() => {
        window.location.href = "/chat";
      });
    };
    grid.appendChild(btn);
  });

  // 前回の結果
  const pastSlug = localStorage.getItem("jiko_last_slug");
  if (pastSlug) {
    const pl = document.getElementById("pastLink");
    pl.style.display = "block";
    pl.href = `/result/${pastSlug}`;
  }
</script>
</body>
</html>
