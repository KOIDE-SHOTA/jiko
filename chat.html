<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>jikoキャラ診断 | 賢者との対話</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060b1a;
      --bg-mid: #0d1530;
      --bg-card: #111a38;
      --gold: #d4af37;
      --gold-light: #f0d060;
      --gold-dim: #8a7020;
      --green: #4a9a5a;
      --text-primary: #f0e8cc;
      --text-secondary: #b8a880;
      --text-dim: #6a5f45;
      --border: rgba(212,175,55,0.2);
      --glow: 0 0 16px rgba(212,175,55,0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Noto Serif JP', serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 38px; height: 38px;
      background: var(--bg-card);
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .header-name {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: var(--gold);
    }
    .header-status { font-size: 11px; color: var(--text-dim); }
    .header-status .dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .progress-bar {
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      flex-shrink: 0;
    }
    .progress-track {
      height: 3px;
      background: rgba(212,175,55,0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .progress-text {
      font-size: 11px;
      color: var(--text-dim);
      text-align: right;
      margin-top: 4px;
      font-family: 'Cinzel', serif;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-wrap {
      display: flex;
      gap: 10px;
      max-width: 480px;
      animation: msgIn 0.3s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-wrap.ai { align-self: flex-start; }
    .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1px solid var(--gold);
      background: var(--bg-card);
    }
    .msg-wrap.user .avatar { border-color: var(--green); }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.8;
      max-width: 340px;
    }
    .msg-wrap.ai .bubble {
      background: #141f42;
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }
    .msg-wrap.user .bubble {
      background: #1a2a1a;
      border: 1px solid rgba(74,154,90,0.3);
      border-top-right-radius: 4px;
    }
    .typing-indicator { display: flex; gap: 5px; padding: 4px 0; }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--gold-dim);
      border-radius: 50%;
      animation: typingDot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%,60%,100%{transform:translateY(0);opacity:0.4;}
      30%{transform:translateY(-6px);opacity:1;}
    }
    .diagnose-wrap {
      display: none;
      padding: 12px 20px 16px;
      flex-shrink: 0;
    }
    .diagnose-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a2a05, #2a4a10);
      border: 2px solid var(--gold);
      border-radius: 6px;
      color: var(--gold);
      font-size: 16px;
      font-family: 'Cinzel', serif;
      letter-spacing: 4px;
      cursor: pointer;
    }
    .input-area {
      background: var(--bg-mid);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'Noto Serif JP', serif;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.6;
    }
    textarea:focus { border-color: var(--gold); }
    textarea::placeholder { color: var(--text-dim); }
    .send-btn {
      width: 44px; height: 44px;
      background: var(--gold);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--bg-deep);
      font-size: 18px;
    }
    .send-btn:disabled { background: var(--text-dim); cursor: not-allowed; }
  </style>
</head>
<body>
<header class="header">
  <div class="header-icon">🔮</div>
  <div>
    <p class="header-name">CINZEL — 賢者の問答</p>
    <p class="header-status"><span class="dot"></span>接続中</p>
  </div>
</header>
<div class="progress-bar">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <p class="progress-text" id="progressText">Q 0 / 4</p>
</div>
<div class="messages" id="messages"></div>
<div class="diagnose-wrap" id="diagnoseWrap">
  <button class="diagnose-btn" onclick="goDiagnose()">⚔ 診断する ⚔</button>
</div>
<div class="input-area" id="inputArea">
  <textarea id="userInput" placeholder="ここに入力..." rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>
<script>
  let done = false;
  let sending = false;
  const messagesEl = document.getElementById("messages");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const diagnoseWrap = document.getElementById("diagnoseWrap");
  const inputArea = document.getElementById("inputArea");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  window.onload = function() {
    const nickname = localStorage.getItem("jiko_nickname") || "あなた";
    const mbti = localStorage.getItem("jiko_mbti") || "";
    fetch("/api/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({nickname, mbti})
    })
    .then(r => r.json())
    .then(data => {
      appendAI(data.message);
      updateProgress(data.question_index, data.total);
      if (data.done) showDiagnoseBtn();
    })
    .catch(e => {
      appendAI("接続エラーが発生しました。ページを更新してください。");
    });
  };

  function appendAI(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap ai";
    wrap.innerHTML = '<div class="avatar">🔮</div><div class="bubble">' + formatText(text) + '</div>';
    messagesEl.appendChild(wrap);
    scrollBottom();
  }
  function appendUser(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap user";
    wrap.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div><div class="avatar">⚔</div>';
    messagesEl.appendChild(wrap);
    scrollBottom();
  }
  function appendTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap ai";
    wrap.id = "typing";
    wrap.innerHTML = '<div class="avatar">🔮</div><div class="bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
    messagesEl.appendChild(wrap);
    scrollBottom();
  }
  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }
  function updateProgress(index, total) {
    const pct = Math.min((index / (total || 4)) * 100, 100);
    progressFill.style.width = pct + "%";
    progressText.textContent = "Q " + Math.min(index, total || 4) + " / " + (total || 4);
  }
  function showDiagnoseBtn() {
    done = true;
    diagnoseWrap.style.display = "block";
    inputArea.style.display = "none";
    scrollBottom();
  }
  function sendMessage() {
    if (sending || done) return;
    const text = userInput.value.trim();
    if (!text) return;
    appendUser(text);
    userInput.value = "";
    autoResize(userInput);
    sendBtn.disabled = true;
    sending = true;
    appendTyping();
    fetch("/api/message", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    })
    .then(r => r.json())
    .then(data => {
      removeTyping();
      appendAI(data.message);
      updateProgress(data.question_index, data.total);
      if (data.done) showDiagnoseBtn();
    })
    .finally(() => {
      sending = false;
      sendBtn.disabled = false;
      userInput.focus();
    });
  }
  function goDiagnose() { window.location.href = "/diagnose"; }
  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }
  function scrollBottom() {
    setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
  }
  function formatText(text) {
    return escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  }
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
