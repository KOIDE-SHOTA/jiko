<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jikoキャラ診断 - チャット</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: linear-gradient(135deg, #fce4ec, #e8eaf6); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.header { width: 100%; max-width: 480px; background: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; }
.header-name { font-weight: 700; font-size: 15px; color: #333; }
.progress-text { font-size: 11px; color: #9575cd; font-weight: 600; margin-left: auto; }
.messages { flex: 1; width: 100%; max-width: 480px; padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.bubble-wrap { display: flex; gap: 10px; align-items: flex-end; }
.bubble-wrap.user { flex-direction: row-reverse; }
.bubble { max-width: 72%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.bubble.ai { background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.bubble.user { background: linear-gradient(135deg, #f48fb1, #ce93d8); color: white; border-bottom-right-radius: 4px; }
.input-area { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; padding: 12px 16px; box-shadow: 0 -2px 12px rgba(0,0,0,0.08); display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; border: 2px solid #f0e6f6; border-radius: 20px; padding: 10px 16px; font-size: 14px; resize: none; outline: none; max-height: 100px; font-family: inherit; color: #333; }
.send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(135deg, #f48fb1, #ce93d8); color: white; font-size: 18px; cursor: pointer; }
.diagnose-btn { width: 90%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(90deg, #f48fb1, #9fa8da); color: white; font-size: 17px; font-weight: 800; cursor: pointer; margin: 8px auto; display: none; }
</style>
</head>
<body>
<div class="header">
<div class="header-name">jikoキャラ診断</div>
<div class="progress-text" id="progressText">0/8</div>
</div>
<div class="messages" id="messages"></div>
<div class="input-area" id="inputArea">
<textarea id="inputText" placeholder="メッセージを入力..." rows="1" onkeydown="handleKey(event)"></textarea>
<button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
</div>
</body>
<script>
let isDone = false;
let isSending = false;
function addBubble(text, isUser) {
  const messages = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap" + (isUser ? " user" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble " + (isUser ? "user" : "ai");
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
}
async function sendMessage() {
  if (isSending || isDone) return;
  const ta = document.getElementById("inputText");
  const text = ta.value.trim();
  if (!text) return;
  ta.value = "";
  addBubble(text, true);
  isSending = true;
  document.getElementById("sendBtn").disabled = true;
  try {
    const res = await fetch("/api/message", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    const data = await res.json();
    addBubble(data.message, false);
    document.getElementById("progressText").textContent = Math.min(data.question_index, 8) + "/8";
    if (data.done) {
      isDone = true;
      document.getElementById("inputArea").style.display = "none";
      const btn = document.createElement("button");
      btn.className = "diagnose-btn";
      btn.style.display = "block";
      btn.textContent = "診断する";
      btn.onclick = () => { window.location.href = "/diagnose"; };
      document.getElementById("messages").appendChild(btn);
    }
  } catch(e) {
    addBubble("エラーが出ちゃった。もう一度試してね", false);
  }
  isSending = false;
  document.getElementById("sendBtn").disabled = false;
}
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
window.onload = () => {
  const first = localStorage.getItem("firstMessage");
  if (first) { addBubble(first, false); localStorage.removeItem("firstMessage"); }
  else { window.location.href = "/"; }
};
</script>
</html>
